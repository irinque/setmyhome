# Customize plugin messages with MiniMessage formatting.
error-player-only: "<red>Run this command in game</red>"
error-no-permission: "<red>Your account cannot use this command</red>"
error-invalid-arguments: "<red>Enter a valid home name</red>"
error-home-not-found: "<red>No saved home matches that name</red>"
error-home-name-invalid: "<red>Home names cannot contain a dot</red>"
error-home-world-unavailable: "<red>The world for this home is unavailable</red>"

sethome-success: "<green>Created home <yellow>{name}</yellow></green>"
sethome-already-exists: "<red>A home with this name already exists</red>"
sethome-max-homes: "<red>You cannot have more than <yellow>{max}</yellow> homes</red>"
delhome-success: "<green>Removed home <yellow>{name}</yellow></green>"

home-teleport-cooldown: "<yellow>Teleport will start in {seconds} seconds</yellow>"
home-teleport-canceled: "<red>Teleportation canceled</red>"
home-teleport-success: "<green>Teleported to home <yellow>{name}</yellow></green>"

admindelhome-usage: "<red>Usage: /admindelhome <player> <home></red>"
admindelhome-player-not-found: "<red>Player <yellow>{player}</yellow> was not found</red>"
admindelhome-success: "<green>Deleted home <yellow>{home}</yellow> from <yellow>{player}</yellow></green>"
admindelhome-no-homes: "<red>Player <yellow>{player}</yellow> has no homes</red>"
