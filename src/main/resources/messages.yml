adminlisthomes-usage: "<red>Usage: /adminlisthomes <player></red>"
adminlisthomes-player-not-found: "<red>Player <yellow>{player}</yellow> was not found</red>"
adminlisthomes-no-homes: "<red>Player <yellow>{player}</yellow> has no homes</red>"
adminlisthomes-header: "<green>Homes for <yellow>{player}</yellow> (<yellow>{count}</yellow>)</green>"
adminlisthomes-entry: "<gray>- <yellow>{name}</yellow>: <white>{world}</white> | <blue>X: {x}, Y: {y}, Z: {z}</blue></gray>"

listhomes-no-homes: "<red>Your home list is empty</red>"
listhomes-header: "<green>Your homes (<yellow>{count}</yellow>)</green>"
listhomes-entry: "<gray>- <yellow>{name}</yellow>: <white>{world}</white> | <blue>X: {x}, Y: {y}, Z: {z}</blue></gray>"
